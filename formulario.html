<!DOCTYPE html>
<html lang="es"> <!--idioma-->
    <head> <!--metadatos-->
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="css/estilos.css"> <!-- estilos -->
        <title>Contanos tu experiencia</title>
    </head>
    <h1>Dejá tu opinión</h1>
    <p>En este apartado pódes compartirnos tu experiencia del lugar que visitaste.</p>

    <form action="#" method="post">
        <label for="nombre">Nombre</label>
        <br>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
        <br>
        <br>

        <label for="lugar">Lugar</label>
        <br>
        <select id="lugar" name="lugar" required>
            <option value="">Selecciona un lugar</option>
            <option value="casa-rosada">La Casa Rosada de la Pantera Rosa</option>
            <option value="caminito">Caminito del Falta Envido</option>
            <option value="museo">Museo de Ciencias (NO) Exactas</option>
        </select>
        <br>
        <br>

        <label for="puntuacion">Puntuación</label>
        <br>
        <select id="puntuacion" name="puntuacion" required>
            <option value="1">⭐</option>
            <option value="2">⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
        </select>
        <br>
        <br>

        <label for="descripcion">Descripción</label>
        <br>
        <textarea id="descripcion" name="descripcion" rows="5" cols="40" 
                placeholder="Escribí tu opinión..."></textarea>
        <br>
        <br>

        <button type="submit">Enviar</button>
    </form>
</html>
