<!DOCTYPE html>
<html lang="es"> <!--idioma-->
    <head> <!--metadatos-->
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width">

        <title>Contanos tu experiencia</title>
    </head>
    <h1>Dejá tu opinión</h1>
    <p>En este apartado pódes compartirnos tu experiencia del lugar que visitaste.</p>

    <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>

        <label for="lugar">Lugar:</label>
        <select id="lugar" name="lugar" required>
            <option value="">Selecciona un lugar</option>
            <option value="casa-rosada">La Casa Rosada de la Pantera Rosa</option>
            <option value="caminito">Caminito del Falta Envido</option>
            <option value="museo">Museo de Ciencias (NO) Exactas</option>
        </select>
    </form>
</html>
