<html lang="es"> <!--idioma-->

        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <!-- estilos CSS -->
        <link rel="stylesheet" href="css/estilos.css">
    </head>

    <body>
        <header>
            <h1>Contanos tu experiencia</h1>
        </header>
        <!-- NAVBAR BOOTSTRAP -->
            <nav class="navbar navbar-expand-lg navbar-aires">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">
                        Aires Buenos
                    </a>

                    <!-- Boton hamburguesa -->
                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menuPrincipal"
                            aria-controls="menuPrincipal"
                            aria-expanded="false"
                            aria-label="Abrir menú">

                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Enlaces -->
                    <div class="collapse navbar-collapse" id="menuPrincipal">
                        <ul class="navbar-nav ms-auto">

                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Inicio</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="lugares.html">Lugares</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="contacto.html">Contacto</a>
                            </li>

                        </ul>
                    </div>
                </div>
            </nav>

        <main>
            <h1>Dejá tu opinión</h1>
            <p>En este espacio, podés contarnos cómo fue tu experiencia en el lugar que visitaste, qué te pareció y 
                qué destacarías de tu visita.</p>

            <form action="#" method="post">
                <label for="nombre">Nombre</label>
                <br>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
                <br>
                <br>

                <label for="lugar">Lugar</label>
                <br>
                <select id="lugar" name="lugar" required>
                    <option value="">Selecciona un lugar</option>
                    <option value="casa-rosada">La Casa Rosada de la Pantera Rosa</option>
                    <option value="caminito">Caminito del Falta Envido</option>
                    <option value="museo">Museo de Ciencias (NO) Exactas</option>
                </select>
                <br>
                <br>

                <label for="puntuacion">Puntuación</label>
                <br>
                <select id="puntuacion" name="puntuacion" required>
                    <option value="1">⭐</option>
                    <option value="2">⭐⭐</option>
                    <option value="3">⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="5">⭐⭐⭐⭐⭐</option>
                </select>
                <br>
                <br>

                <label for="descripcion">Descripción</label>
                <br>
                <textarea id="descripcion" name="descripcion" rows="5" cols="40" 
                        placeholder="Escribí tu opinión..."></textarea>
                <br>
                <br>

                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </main>
        
        <footer> 
            <p>
                &copy; 2026 Descubrí Aires Buenos
            </p> 
        </footer>
        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
